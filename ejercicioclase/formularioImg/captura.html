<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Jugador</title>
    <style>
        body {
            background-color: #8c92ac;
            font-family: monospace, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 450px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .field-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="number"], input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        fieldset {
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 10px 15px;
            margin-bottom: 15px;
        }
        legend {
            font-weight: bold;
            padding: 0 5px;
        }
        .options-group label {
            display: block;
            font-weight: normal;
            margin-bottom: 6px;
            cursor: pointer;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-submit { background-color: #007bff; }
        .btn-reset { background-color: #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Formulario de Jugador</h1>
        <form action="index.php" method="POST" enctype="multipart/form-data">
            <div class="field-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="field-group">
                <label for="alias">Alias:</label>
                <input type="text" id="alias" name="alias" required>
            </div>

            <div class="field-group">
                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" min="1" required>
            </div>

            <fieldset>
                <legend>Armas a elegir (puedes elegir varias):</legend>
                <div class="options-group">
                    <label><input type="checkbox" name="armas[]" value="Maza"> Maza</label>
                    <label><input type="checkbox" name="armas[]" value="Antorcha"> Antorcha</label>
                    <label><input type="checkbox" name="armas[]" value="Martillo"> Martillo</label>
                    <label><input type="checkbox" name="armas[]" value="Látigo"> Látigo</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>¿Practica artes mágicas?</legend>
                <div class="options-group">
                    <label><input type="radio" name="magia" value="Sí" required> Sí</label>
                    <label><input type="radio" name="magia" value="No"> No</label>
                </div>
            </fieldset>

            <div class="field-group">
                <label for="imagen">Subir imagen:</label>
                <!-- Control de tamaño en la parte cliente (10 KB = 10240 bytes) -->
                <input type="hidden" name="MAX_FILE_SIZE" value="10240">
                <input type="file" id="imagen" name="imagen" accept="image/png">
            </div>

            <div class="btn-container">
                <button type="submit" class="btn btn-submit">Enviar</button>
                <button type="reset" class="btn btn-reset">Borrar</button>
            </div>
        </form>
    </div>
</body>
</html>
